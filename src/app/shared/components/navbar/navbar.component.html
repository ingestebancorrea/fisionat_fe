<header class="header">
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo-container">
        <a href="#inicio" class="logo-link">
          <img src="logo.png" alt="FisioNat Logo">
        </a>
      </div>

      <div class="nav-links">
        <a href="#inicio" class="nav-link">Inicio</a>
        <a href="#beneficios" class="nav-link">Beneficios</a>
        <a href="#servicios" class="nav-link">Servicios</a>
        <a href="#contacto" class="nav-link nav-link-cta">Agendar Consulta</a>
      </div>

      @if (isMobile) {
        <button class="menu-button" (click)="toggleMobileMenu()">
          <mat-icon>{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
        </button>
      }
    </div>
  </nav>

  @if (isMobile && mobileMenuOpen) {
    <div class="mobile-menu">
      <a href="#inicio" (click)="toggleMobileMenu()">Inicio</a>
      <a href="#beneficios" (click)="toggleMobileMenu()">Beneficios</a>
      <a href="#servicios" (click)="toggleMobileMenu()">Servicios</a>
      <a href="#contacto" (click)="toggleMobileMenu()">Agendar Consulta</a>
    </div>
  }

  @if (isMobile && mobileMenuOpen) {
    <div class="menu-overlay" (click)="toggleMobileMenu()"></div>
  }
</header>
